[package]
name = "pop-game"
version = "0.1.0"
edition = "2021"
description = "Proof-of-Play game contract: one NEP-141 coin with its own vault, paid runs, play-mining and a buy-only curve"
license = "MIT"
repository = "https://github.com/PixieEncode/Game-Launchpad-Near"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"
near-contract-standards = "5.30"
uint = { version = "0.10", default-features = false }

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }
ed25519-dalek = "2"
