[workspace]
resolver = "2"
members = ["game", "factory", "tests"]
# The sandbox tests need a Linux or macOS NEAR sandbox; run them with `-p pop-sandbox-tests`.
default-members = ["game", "factory"]

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
