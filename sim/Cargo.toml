[package]
name = "pop-sim"
version = "0.1.0"
edition = "2021"
description = "Deterministic Proof-of-Play game core: the four templates in integer maths at a fixed 60 ticks per second"
license = "MIT"
repository = "https://github.com/PixieEncode/Game-Launchpad-Near"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
