[package]
name = "pop-verifier"
version = "0.1.0"
edition = "2021"
description = "Proof-of-Play score verifier for OutLayer: replays a run with the game core and signs the score inside the enclave"
license = "MIT"
repository = "https://github.com/PixieEncode/Game-Launchpad-Near"

[lib]
path = "src/lib.rs"

[[bin]]
name = "pop-verifier"
path = "src/main.rs"

[dependencies]
pop-sim = { path = "../sim" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = "0.36"

[dev-dependencies]
ed25519-dalek = "2"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
