name: contracts

on:
  push:
    paths: ["near/**", ".github/workflows/contracts.yml"]
  pull_request:
    paths: ["near/**", ".github/workflows/contracts.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: near
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: near
      - name: Install cargo-near
        run: npm install -g cargo-near@0.23.0
      - name: Build the game contract
        run: cargo near build non-reproducible-wasm --no-abi --manifest-path game/Cargo.toml
      - name: Build the factory contract (embeds the game)
        run: cargo near build non-reproducible-wasm --no-abi --manifest-path factory/Cargo.toml
      - name: Contract sizes
        run: ls -l target/near/pop_game/pop_game.wasm target/near/pop_factory/pop_factory.wasm
      - name: Unit tests and floor simulation
        run: cargo test --release
      - name: Sandbox tests
        run: cargo test -p pop-sandbox-tests
